kind = "web"
previewPath = "/"
title = "Quantum Teaching Lab"
version = "1.0.0"
id = "artifacts/quantum-lab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18579

[services.development]
run = "pnpm --filter @workspace/quantum-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quantum-lab", "run", "build" ]
publicDir = "artifacts/quantum-lab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18579"
BASE_PATH = "/"
